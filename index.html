<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice TI</title>


    <!-- Lien pour les icones bootstrap -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous"> -->



    <!-- Lien pour la police -->
    <link href="https://fonts.googleapis.com/css2?family=Handjet:wght@100..900&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main>
        <!-- Container écran grid -->
        <div class="container_screen">
            <!-- container_screen -->
            <div class="screen">
                <p>123,456.78</p>
            </div>
            <div class="m_in_screen">
                <p>M</p>
            </div>
        </div>

        <!-- Container nom et panneau grid -->
        <div class="container_name_and_solar_panel">
            <!-- container_name_and_solar_panel -->
            <div class="information_calculator">
                <div class="information_calculator_row_1">
                    <img src="logo_TI.png" alt="logo de Texas Instruments">
                    <!-- <p>TEXAS INSTRUMENTS</p> -->
                </div>
                <div class="information_calculator_row_2">
                    <p>TI-1776</p>
                </div>
            </div>
            <div class="container_solar_panel">
                <div class="solar_panel">
                    <!-- he -->
                    <div class="solar_panel_element"></div>
                    <div class="solar_panel_element"></div>
                    <div class="solar_panel_element"></div>
                    <div class="solar_panel_element"></div>
                    <!-- solar_panel -->
                </div>
            </div>

        </div>

        <!-- Container pavé -->
        <div class="container_pad">
            <!-- container_pad -->
            <div class="container_pad_column_left">
                <button class="B_left_column_large">ON/C</button>
                <button class="B_left_column_normal">&radic;</button>
                <!-- <button class="B_left_column_normal">V</button> -->
                <button class="B_left_column_normal">%</button>
                <button class="B_left_column_normal">+/-</button>
                <!-- column_left -->
            </div>

            <div class="container_pad_center">
                <button class="B_center_top_row">MRC</button>
                <button class="B_center_top_row">M-</button>
                <button class="B_center_top_row">M+</button>
                <button class="B_center_normal">7</button>
                <button class="B_center_normal">8</button>
                <button class="B_center_normal">9</button>
                <button class="B_center_normal">4</button>
                <button class="B_center_normal">5</button>
                <button class="B_center_normal">6</button>
                <button class="B_center_normal">1</button>
                <button class="B_center_normal">2</button>
                <button class="B_center_normal">3</button>
                <button class="B_center_normal">0</button>
                <button class="B_center_normal"><p><i class="bi bi-dot"></i></p></button>
                <button class="B_center_operator">=</button>
                <!-- pad_center -->
            </div>

            <div class="container_pad_column_right">
                <button class="B_right_column_normal">&divide;</button>
                <!-- <button class="B_right_column_normal">/</button> -->
                <button class="B_right_column_normal">&times;</button>
                <!-- <button class="B_right_column_normal">*</button> -->
                <button class="B_right_column_normal">-</button>
                <button class="B_right_column_large">+</button>
                <!-- column_right -->
            </div>


        </div>

    </main>




</body>



</html>
